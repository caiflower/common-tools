syntax = "proto3";

package cluster;

option go_package = "github.com/caiflower/common-tools/cluster/proto";

import "google/protobuf/any.proto";

service ClusterService {
  rpc AskLeader(AskLeaderRequest) returns (AskLeaderResponse);
  rpc AskVote(AskVoteRequest) returns (AskVoteResponse);
  rpc BroadcastLeader(BroadcastLeaderRequest) returns (BroadcastLeaderResponse);
  rpc Heartbeat(stream HeartbeatRequest) returns (stream HeartbeatResponse);
  rpc RemoteCall(RemoteCallRequest) returns (RemoteCallResponse);
}

message AskLeaderRequest {
  string node_name = 1;
  int32 term = 2;
}

message AskLeaderResponse {
  string node_name = 1;
  int32 term = 2;
  string leader_node_name = 3;
  bool success = 4;
}

message AskVoteRequest {
  string node_name = 1;
  int32 term = 2;
}

message AskVoteResponse {
  string node_name = 1;
  int32 term = 2;
  string vote_node_name = 3;
  bool success = 4;
}

message BroadcastLeaderRequest {
  string node_name = 1;
  int32 term = 2;
  string leader_node_name = 3;
}

message BroadcastLeaderResponse {
  string node_name = 1;
  int32 term = 2;
  string leader_node_name = 3;
  bool success = 4;
}

message HeartbeatRequest {
  string node_name = 1;
  int32 term = 2;
}

message HeartbeatResponse {
  string node_name = 1;
  int32 term = 2;
  string leader_node_name = 3;
  bool success = 4;
}

message RemoteCallRequest {
  string trace_id = 1;
  string uuid = 2;
  string func_name = 3;
  google.protobuf.Any param = 4;
  bool sync = 5;
}

message RemoteCallResponse {
  string trace_id = 1;
  string uuid = 2;
  string func_name = 3;
  google.protobuf.Any result = 4;
  string err = 5;
}
